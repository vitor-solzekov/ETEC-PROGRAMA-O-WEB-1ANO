<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        * {
            box-sizing: border-box;

        }

        .caixa-exemplo {
            width: 400px;
            background-color: #3498fb;
            color: white;

            padding: 40px;

            border: 10px solid #2c3e50;

            text-align: center;
            font-size: 20px;

        }

        .caixa-variada {
            width: 400px;
            margin-top: 20px;
            background-color: #ecf0f1;
            color: #333;
            border: 2px dashed #7f8c8d;  
            /* dashed: borda tracejada */

            padding-top: 10px;
            padding-bottom: 50px;
            padding-left: 20px;
            padding-right: 100px;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 9</title>
</head>
<body>
    <div class="caixa-exemplo">
        eu sou uma caixa azul com preenchimento interno
    </div>

    <div class="caixa-variada">
        esta caixa tem espaços iternos diferentes em cada lado.
    </div>
</body>
</html>
